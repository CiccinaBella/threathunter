title: Accès à la mémoire de LSASS / dump d'identifiants
id: TH-0101
level: critical
description: Outils ou commandes connus pour extraire les identifiants de LSASS.
tags: [attack.credential_access, attack.t1003.001]
detection:
  mimikatz:
    command_line|contains: ['sekurlsa::', 'lsadump::', 'privilege::debug', 'kerberos::golden']
  procdump:
    command_line|contains|all: ['lsass', '-ma']
  comsvcs:
    command_line|contains|all: ['comsvcs', 'minidump']
  condition: 1 of them
---
title: Extraction de la base SAM / NTDS
id: TH-0102
level: high
description: Copie des ruches SAM/SYSTEM ou de NTDS.dit.
tags: [attack.credential_access, attack.t1003.002, attack.t1003.003]
detection:
  reg:
    process|endswith: '\reg.exe'
    command_line|contains: ['save hklm\sam', 'save hklm\system', 'save hklm\security']
  ntds:
    command_line|contains: ['ntds.dit', 'ntdsutil']
  condition: reg or ntds
